<script>
        function loadTicketData() {
            let data = null;
            
            // 1. URLのパラメータ（?data=...）があるか最優先で確認する
            const urlParams = new URLSearchParams(window.location.search);
            const rawData = urlParams.get('data');
            
            if (rawData) {
                try {
                    // Base64をデコードしてJSONに戻す
                    const jsonString = decodeURIComponent(escape(atob(rawData)));
                    data = JSON.parse(jsonString);
                    // 次回以降のためにlocalStorageにも保存しておく
                    localStorage.setItem('l_tike_ticket_data', JSON.stringify(data));
                } catch(e) {
                    console.error("データ解析エラー", e);
                }
            }
            
            // 2. URLになければ従来通り localStorage から読み込む
            if (!data) {
                try { data = JSON.parse(localStorage.getItem('l_tike_ticket_data')); } catch(e) {}
            }

            const header = document.getElementById('headerContainer');
            if (data && data.bgChoice === 'orange') {
                header.style.backgroundImage = "url('IMG_8164.jpeg')";
                header.classList.add('orange-theme');
            } else {
                header.style.backgroundImage = "url('bg.jpg')";
                header.classList.remove('orange-theme');
            }
            
            if (data) {
                if (data.eventTitle) document.getElementById('valEventTitle').textContent = data.eventTitle;
                if (data.date) document.getElementById('valDate').textContent = data.date;
                if (data.time) document.getElementById('valTime').textContent = data.time;
                if (data.ticketType) document.getElementById('valTicketType').textContent = data.ticketType;
                if (data.seatNum) document.getElementById('valSeatNum').textContent = data.seatNum;
                if (data.name) document.getElementById('valName').textContent = data.name + (data.name.endsWith('様') ? '' : '様');
                if (data.phone) document.getElementById('valPhone').textContent = data.phone;
                if (data.price) document.getElementById('valPrice').textContent = data.price + (data.price.includes('円') ? '' : '円');
                if (data.notice) {
                    document.getElementById('accordionContent').innerHTML = data.notice.split('\n').map(l => `<p>${l}</p>`).join('');
                }
            }
        }
        loadTicketData();

        const checkBox = document.getElementById('checkBox'),
              headerContainer = document.getElementById('headerContainer'),
              auroraSlideLayer = document.getElementById('auroraSlideLayer'),
              scratchContainer = document.getElementById('scratchContainer'),
              alertBanner = document.getElementById('alertBanner'),
              stampEntered = document.getElementById('stampEntered'),
              ticketCard = document.getElementById('ticketCard'),
              ticketArea = document.getElementById('ticketArea'),
              entryTimeDisplay = document.getElementById('entryTimeDisplay'),
              ticketCountNum = document.getElementById('ticketCountNum'),
              accordionBar = document.getElementById('accordionBar'),
              accordionContent = document.getElementById('accordionContent');

        let isChecked = false, isEntered = false, startX = 0, currentTranslateX = 0;

        checkBox.addEventListener('click', () => {
            if (isEntered) return;
            isChecked = !isChecked;
            checkBox.classList.toggle('checked', isChecked);
            ticketArea.classList.toggle('checked-blue', isChecked);
            alertBanner.classList.toggle('visible', isChecked);
            scratchContainer.classList.toggle('visible', isChecked);
            ticketCountNum.textContent = isChecked ? '合計 1 / 1枚' : '合計 1枚';
            if (!isChecked) {
                auroraSlideLayer.classList.remove('active');
                auroraSlideLayer.style.transform = 'translateX(0px)';
            }
        });

        headerContainer.addEventListener('pointerdown', (e) => {
            if (!isChecked || isEntered) return;
            scratchContainer.style.display = 'none';
            auroraSlideLayer.classList.add('active');
            startX = e.clientX;
        });

        headerContainer.addEventListener('pointermove', (e) => {
            if (!isChecked || isEntered || startX === 0) return;
            const diffX = e.clientX - startX;
            if (diffX > 0) { currentTranslateX = diffX; auroraSlideLayer.style.transform = `translateX(${currentTranslateX}px)`; }
        });

        headerContainer.addEventListener('pointerup', () => {
            if (!isChecked || isEntered) return;
            if (currentTranslateX > 80) {
                isEntered = true;
                auroraSlideLayer.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                auroraSlideLayer.style.transform = 'translateX(100vw)';
                auroraSlideLayer.style.opacity = '0';
                setTimeout(() => {
                    stampEntered.classList.add('active');
                    const now = new Date();
                    entryTimeDisplay.textContent = `入場時間：${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                    entryTimeDisplay.style.display = 'block';
                    ticketArea.classList.remove('checked-blue');
                    ticketCard.classList.add('entered');
                    checkBox.classList.remove('checked');
                    auroraSlideLayer.classList.remove('active', 'transition');
                    auroraSlideLayer.style.transform = 'translateX(0px)';
                    auroraSlideLayer.style.opacity = '1';
                    scratchContainer.classList.remove('visible');
                    scratchContainer.style.display = 'none';
                    alertBanner.classList.remove('visible');
                    ticketCountNum.textContent = '合計 1 / 1枚';
                }, 300);
            } else {
                auroraSlideLayer.style.transition = 'transform 0.3s ease';
                auroraSlideLayer.style.transform = 'translateX(0px)';
                setTimeout(() => { auroraSlideLayer.style.transition = ''; }, 300);
            }
            startX = 0; currentTranslateX = 0;
        });

        accordionBar.addEventListener('click', () => {
            accordionBar.classList.toggle('open');
            accordionContent.classList.toggle('open');
        });
    </script>
